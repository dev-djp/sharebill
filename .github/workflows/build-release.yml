name: Build and Release APK

on:
  push:
    branches: [ main, develop, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./apps/sharebill_app
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.16.0'
        channel: 'stable'
        cache: true
        
    - name: Check Flutter version
      run: flutter doctor -v
        
    - name: Get dependencies
      run: flutter pub get
      
    - name: Analyze code
      run: flutter analyze
      continue-on-error: true
      
    - name: Build APK
      run: flutter build apk --release --verbose
      
    - name: Upload APK as artifact
      uses: actions/upload-artifact@v4
      with:
        name: sharebill-apk
        path: apps/sharebill_app/build/app/outputs/flutter-apk/app-release.apk
        retention-days: 7
        
    - name: Check APK exists
      if: startsWith(github.ref, 'refs/tags/v')
      run: |
        ls -la build/app/outputs/flutter-apk/
        
    - name: Rename APK with version
      if: startsWith(github.ref, 'refs/tags/v')
      working-directory: ./
      run: |
        VERSION=${GITHUB_REF#refs/tags/v}
        cp apps/sharebill_app/build/app/outputs/flutter-apk/app-release.apk sharebill-v${VERSION}.apk
        echo "APK_NAME=sharebill-v${VERSION}.apk" >> $GITHUB_ENV
        
    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/v')
      id: create_release
      uses: softprops/action-gh-release@v1
      with:
        name: ShareBill ${{ github.ref_name }}
        body: |
          ## ShareBill 安卓 APK 发布
          
          ### 安装说明
          1. 下载 `sharebill-*.apk` 文件
          2. 在安卓手机上允许安装未知来源应用
          3. 安装 APK
          
          ### 开发阶段登录
          - 手机号: 任意 11 位手机号
          - 验证码: 手机号后 6 位
          - 示例: 手机号 `13800138000`，验证码 `138000`
          
          ### 功能
          - 基础记账
          - 时间分摊
          - 次数分摊
          - 标签管理
          - 家庭/群组分摊
          
          ### 更新日志
          详见 [CHANGELOG.md](./CHANGELOG.md)
        files: sharebill-v*.apk
        prerelease: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
