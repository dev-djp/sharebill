version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: sharebill-db
    environment:
      POSTGRES_USER: sharebill
      POSTGRES_PASSWORD: sharebill123
      POSTGRES_DB: sharebill
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sharebill"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sharebill-redis
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: sharebill-api
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://sharebill:sharebill123@postgres:5432/sharebill?schema=public
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=dev-secret-key-change-in-production
      - PORT=3000
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./apps/api:/app
      - /app/node_modules
    command: npm run start:dev

volumes:
  postgres_data:
  redis_data:
